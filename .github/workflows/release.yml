name: Upload to CurseForge
on:
  push:
    branches:
      - main
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create zip
        run: |
          mkdir HandyNotes_NaigtalTeleports
          cp *.lua *.toc HandyNotes_NaigtalTeleports/
          zip -r HandyNotes_NaigtalTeleports.zip HandyNotes_NaigtalTeleports
      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: "${{ secrets.HANDYNOTESNAIGTALTELEPORTS }}"
          project_id: "1599102"
          game_endpoint: "wow"
          file_path: "HandyNotes_NaigtalTeleports.zip"
          game_versions: "12.1.0"
          release_type: "release"
          display_name: "HandyNotes_NaigtalTeleports - ${{ github.event.head_commit.timestamp }}"
          changelog: "${{ github.event.head_commit.message }}"
          changelog_type: "markdown"